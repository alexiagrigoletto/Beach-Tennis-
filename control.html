<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Beach Tennis Control</title><link rel="stylesheet" href="style.css"><style>
.reset-btn{
  width:100%;
  min-height:56px;
  font-weight:800;
  font-size:18px;
  letter-spacing:.4px;
  border-radius:14px;
}
</style></head><body class="control"><div class="panel"><h1>Beach Tennis Control</h1><div class="card"><div class="status" id="status">Conectando…</div></div><div class="card"><h2>Atletas e países</h2><div id="players" class="grid"></div></div><div class="card"><h2>Formato da partida</h2><div class="row"><button id="fmt6" onclick="setFormat('standard6')">SET ATÉ 6 GAMES</button><button id="fmt4" onclick="setFormat('short4')">SET CURTO ATÉ 4 GAMES</button></div><div class="status" id="formatHelp"></div></div><div class="card"><h2>Controle da partida</h2><div id="modeStatus" class="status"></div><div id="operatorScore"></div><div class="row" style="margin-top:14px"><button onclick="toggleServe()">Trocar saque</button><button onclick="setSet(0)">1º Set</button><button onclick="setSet(1)">2º Set</button><button onclick="setTie()">TIE</button><button onclick="setSuperTie()">SUPER TIE</button><button onclick="undo()">↶ Desfazer</button></div></div><div class="card"><h2>Torneio / clima</h2><div class="grid4"><input data-e="org" placeholder="ITF / CBT / FPT"><input data-e="category" placeholder="BT200"><input data-e="division" placeholder="FEMININO"><input data-e="round" placeholder="SEMIFINAL"><input data-e="city" placeholder="Cidade/UF"><input data-e="temp"><input data-e="wind"><input id="rotation" type="number" min="3"></div></div><div class="card"><h2>Patrocinadores</h2><div id="sponsors"></div><button onclick="addSponsor()">+ Patrocinador</button></div><div class="card"><button class="danger reset-btn" onclick="resetAll()">↻ RESET PARTIDA</button></div></div><script src="/socket.io/socket.io.js"></script><script src="common.js"></script><script>
let state=null,history=[];const socket=io(),clone=x=>JSON.parse(JSON.stringify(x));function emit(){socket.emit("state",state)}socket.on("connect",()=>status.textContent="● Conectado");socket.on("disconnect",()=>status.textContent="○ Desconectado");socket.on("state",s=>{state=s;ensureScoreState(state);render()});function snap(){history.push(clone(state));if(history.length>30)history.shift()}function addPoint(i){if(state.matchOver)return;snap();gamePoint(state,i);emit();render()}function setFormat(fmt){if(state.teams.some(t=>t.sets.some(x=>x>0)||t.point>0)||state.mode!=="normal"){if(!confirm("Alterar o formato com a partida em andamento? Recomenda-se usar RESET antes."))return}snap();state.matchFormat=fmt;emit();render()}function toggleServe(){snap();state.serverTeam=1-state.serverTeam;emit();render()}function setSet(i){snap();state.matchOver=false;state.winner=null;state.currentSet=i;state.mode="normal";state.teams[0].point=state.teams[1].point=0;emit();render()}function setTie(){snap();state.matchOver=false;state.winner=null;state.mode="tie";state.teams[0].point=state.teams[1].point=0;emit();render()}function setSuperTie(){snap();state.matchOver=false;state.winner=null;state.mode="superTie";state.teams[0].point=state.teams[1].point=0;emit();render()}function undo(){if(history.length){state=history.pop();emit();render()}}async function resetAll(){if(confirm("RESETAR A PARTIDA?\n\nO placar será zerado e a partida voltará ao início."))await fetch("/api/reset",{method:"POST"})}
function render(){if(!state)return;ensureScoreState(state);const short=state.matchFormat==="short4";fmt6.className=short?"":"primary";fmt4.className=short?"primary":"";formatHelp.textContent=short?"SET CURTO: vence com 4 games e diferença de 2; em 4–4, Tie-Break até 7.":"SET PADRÃO: vence com 6 games e diferença de 2; em 6–6, Tie-Break até 7.";modeStatus.textContent=state.matchOver?`🏆 PARTIDA ENCERRADA — DUPLA ${state.winner+1}`:state.mode==="normal"?`● ${state.currentSet+1}º SET — No-Ad 0/15/30/40`:state.mode==="tie"?`● TIE DO ${state.currentSet+1}º SET — até 7, diferença de 2`:`● SUPER TIE — até 10, diferença de 2`;const card=(t,i)=>`<div style="border:2px solid ${state.serverTeam===i?'#161b22':'#d9dee7'};border-radius:14px;padding:14px;margin:10px 0;background:${state.serverTeam===i?'#f4f6f9':'#fff'}"><div style="font-weight:800;font-size:18px">${t.players.map(p=>`${flag(p.country)} ${p.name}`).join(" / ")} ${state.serverTeam===i?"● SAQUE":""}</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;text-align:center;margin:12px 0"><div>SET 1<br><b>${t.sets[0]}</b></div><div>SET 2<br><b>${t.sets[1]}</b></div><div>TIE<br><b>${state.mode==="tie"?t.ties[state.currentSet]:"-"}</b></div><div>SUPER TIE<br><b>${state.mode==="superTie"?t.superTie:"-"}</b></div><div>PTS<br><b>${points(t,state)}</b></div></div><button class="primary wide" onclick="addPoint(${i})">+ PONTO DUPLA ${i+1}</button></div>`;operatorScore.innerHTML=card(state.teams[0],0)+card(state.teams[1],1);players.innerHTML=state.teams.flatMap((t,ti)=>t.players.map((p,pi)=>`<div class="row"><input style="flex:1" value="${p.name}" onchange="player(${ti},${pi},'name',this.value)"><input style="width:75px" maxlength="2" value="${p.country}" onchange="player(${ti},${pi},'country',this.value)"></div>`)).join("");document.querySelectorAll("[data-e]").forEach(el=>{el.value=state.event[el.dataset.e]||"";el.onchange=()=>{state.event[el.dataset.e]=el.value;emit()}});rotation.value=state.rotationSeconds;rotation.onchange=()=>{state.rotationSeconds=Number(rotation.value)||9;emit()};sponsors.innerHTML=state.sponsors.map((s,i)=>`<div class="grid"><input value="${s.name}" onchange="sponsor(${i},'name',this.value)"><input value="${s.logo}" onchange="sponsor(${i},'logo',this.value)"></div>`).join("")}function player(t,p,k,v){state.teams[t].players[p][k]=v;emit()}function sponsor(i,k,v){state.sponsors[i][k]=v;emit()}function addSponsor(){state.sponsors.push({name:"NOVO PATROCINADOR",logo:""});emit();render()}</script></body></html>
