<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Overlay</title><link rel="stylesheet" href="style.css"></head>
<body class="overlay">
<div id="score" class="score"></div>
<div id="eventPill" class="event-pill"></div>
<div id="sponsorCorner" class="sponsor-corner"></div>
<script src="/socket.io/socket.io.js"></script><script src="common.js"></script><script>
let state=null, sponsorIndex=0, timer=null;

function draw(){
 if(!state)return;
 const e=state.event||{};
 const title=[e.division,e.round].filter(Boolean).join(" • ");
 const h=`<div class="score-title">${title||"BEACH TENNIS"}</div>
 <div class="head"><span>ATLETAS</span><span>SET 1</span><span>SET 2</span><span>MTB</span><span>PTS</span></div>`;
 const teams=state.teams.map((t,i)=>`<div class="team">
   <div class="players">${t.players.map(p=>`<div class="player"><span class="flag">${flag(p.country)}</span>${p.name}</div>`).join("")}</div>
   <div class="cell">${t.sets[0]}</div><div class="cell">${t.sets[1]}</div>
   <div class="cell">${state.inMTB?t.mtb:"-"}</div>
   <div class="pts">${points(t,state)}${state.serverTeam===i?'<span class="serve"></span>':""}</div>
 </div>`).join("");
 document.getElementById("score").innerHTML=h+teams;
 drawEvent();
 drawSponsor();
}
function drawEvent(){
 const e=state.event||{};
 const parts=[];
 if(e.org) parts.push(`<strong>${e.org}</strong>`);
 if(e.category) parts.push(`<strong>${e.category}</strong>`);
 if(e.temp) parts.push(`<span>☀ ${e.temp}°C</span>`);
 if(e.wind) parts.push(`<span>💨 ${e.wind} km/h</span>`);
 if(e.city) parts.push(`<span>${e.city}</span>`);
 document.getElementById("eventPill").innerHTML=parts.join('<span class="pill-sep"></span>');
}
function drawSponsor(){
 const sponsors=(state.sponsors||[]).filter(s=>s.logo);
 const box=document.getElementById("sponsorCorner");
 if(!sponsors.length){ box.innerHTML=""; return; }
 sponsorIndex%=sponsors.length;
 box.innerHTML=`<img src="${sponsors[sponsorIndex].logo}" alt="">`;
}
function resetTimer(){
 clearInterval(timer);
 const seconds=Math.max(3,state?.rotationSeconds||9);
 timer=setInterval(()=>{
   const sponsors=(state?.sponsors||[]).filter(s=>s.logo);
   if(sponsors.length>1){sponsorIndex=(sponsorIndex+1)%sponsors.length;drawSponsor()}
 },seconds*1000);
}
const socket=io();socket.on("state",s=>{state=s;draw();resetTimer()});
</script></body></html>
